[isort]
line_length = 100
known_first_party = config,users,employees
; stdlib is folded into THIRDPARTY on purpose: 7.4 defines a single first block
; (stdlib + Django + third parties) under one heading, alphabetically sorted
sections = THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY
import_heading_thirdparty = external libraries imports
import_heading_firstparty = internal application code imports
; relative imports belong to the same second block; in practice only __init__.py uses
; them (7.2), so the heading is not emitted twice
import_heading_localfolder = internal application code imports
include_trailing_comma = true
skip = .venv,migrations
